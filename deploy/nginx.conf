# 二游 MMD 模型导航 —— nginx 反向代理配置
# 用法：把下面的 mmd.example.com 换成你的域名，丢到 /etc/nginx/conf.d/mmdhub.conf
# 证书用 certbot 签：certbot --nginx -d mmd.example.com 会自动把 ssl 那几行补好

# 提交接口单独限流：每 IP 每分钟 10 次，突发 5
limit_req_zone $binary_remote_addr zone=mmd_submit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=mmd_conn:10m;

# ---------- 80：跳 HTTPS ----------
server {
    listen 80;
    server_name mmd.example.com;

    # certbot 续期验证用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name mmd.example.com;

    ssl_certificate     /etc/letsencrypt/live/mmd.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mmd.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    client_max_body_size 256k;
    limit_conn mmd_conn 20;

    # 转发真实 IP，server.py 会读这几个头做限流
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # 提交接口额外限流
    location = /api/submit {
        limit_req zone=mmd_submit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # 不要暴露数据文件和口令
    location ~ ^/data/ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
